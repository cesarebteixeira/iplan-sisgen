{% extends "base.html" %}

{% block title %}Novo Bairro - Capacidade 1{% endblock %}

{% block content %}
<div class="page-header">
    <h2>C023T: Novo Bairro</h2>
</div>

<div class="form-container">
    <h3>Criar Novo Bairro</h3>
    <form method="POST" class="form">
        <div class="form-group">
            <label for="codigo_bairro">Código <span style="color:red;">*</span></label>
            <input type="text" id="codigo_bairro" name="codigo_bairro" maxlength="3" required placeholder="3 dígitos">
        </div>
        
        <div class="form-group">
            <label for="descricao">Descrição <span style="color:red;">*</span></label>
            <input type="text" id="descricao" name="descricao" maxlength="25" required placeholder="Máximo 25 caracteres">
        </div>
        
        <div style="margin-top: 1.5rem;">
            <button type="submit" class="btn btn-success">Salvar</button>
            <a href="{{ url_for('bairro.listar') }}" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
