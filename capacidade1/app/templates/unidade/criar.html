{% extends "base.html" %}

{% block title %}Nova Unidade Orçamentária - Capacidade 1{% endblock %}

{% block content %}
<div class="page-header">
    <h2>C025T: Nova Unidade Orçamentária</h2>
</div>

<div class="form-container">
    <h3>Criar Nova Unidade Orçamentária</h3>
    <form method="POST" class="form">
        <div class="form-group">
            <label for="codigo_unidade">Código Unidade <span style="color:red;">*</span></label>
            <input type="text" id="codigo_unidade" name="codigo_unidade" maxlength="8" required placeholder="8 dígitos">
        </div>
        
        <div class="form-group">
            <label for="descricao">Descrição <span style="color:red;">*</span></label>
            <input type="text" id="descricao" name="descricao" maxlength="40" required placeholder="Máximo 40 caracteres">
        </div>
        
        <div style="margin-top: 1.5rem;">
            <button type="submit" class="btn btn-success">Salvar</button>
            <a href="{{ url_for('unidade.listar') }}" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
