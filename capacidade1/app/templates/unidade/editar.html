{% extends "base.html" %}

{% block title %}Editar Unidade Orçamentária - Capacidade 1{% endblock %}

{% block content %}
<div class="page-header">
    <h2>C025T: Editar Unidade Orçamentária</h2>
</div>

<div class="form-container">
    <h3>Editar Unidade Orçamentária</h3>
    <form method="POST" class="form">
        <div class="form-group">
            <label>Código Unidade</label>
            <input type="text" value="{{ unidade.codigo_unidade }}" readonly disabled>
        </div>
        
        <div class="form-group">
            <label for="descricao">Descrição <span style="color:red;">*</span></label>
            <input type="text" id="descricao" name="descricao" maxlength="40" required value="{{ unidade.descricao }}">
        </div>
        
        <div class="form-group">
            <label>Data de Criação</label>
            <input type="text" value="{{ unidade.data_criacao.strftime('%Y-%m-%d %H:%M:%S') if unidade.data_criacao else '-' }}" readonly disabled>
        </div>
        
        <div class="form-group">
            <label>Data de Modificação</label>
            <input type="text" value="{{ unidade.data_modificacao.strftime('%Y-%m-%d %H:%M:%S') if unidade.data_modificacao else '-' }}" readonly disabled>
        </div>
        
        <div style="margin-top: 1.5rem;">
            <button type="submit" class="btn btn-success">Salvar Alterações</button>
            <a href="{{ url_for('unidade.listar') }}" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
