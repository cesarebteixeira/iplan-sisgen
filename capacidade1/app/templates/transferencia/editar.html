{% extends "base.html" %}

{% block title %}Editar Transferência - Capacidade 1{% endblock %}

{% block content %}
<div class="page-header">
    <h2>Editar Transferência entre Órgãos</h2>
</div>

<div class="form-container">
    <h3>Editar Transferência</h3>
    <form method="POST" class="form">
        <div class="form-group">
            <label for="descricao">Descrição</label>
            <textarea id="descricao" name="descricao" rows="4">{{ transferencia.descricao if transferencia.descricao else '' }}</textarea>
        </div>
        
        <div class="form-group">
            <label>Data de Criação</label>
            <input type="text" value="{{ transferencia.data_criacao.strftime('%Y-%m-%d %H:%M:%S') if transferencia.data_criacao else '-' }}" readonly disabled>
        </div>
        
        <div class="form-group">
            <label>Data de Modificação</label>
            <input type="text" value="{{ transferencia.data_modificacao.strftime('%Y-%m-%d %H:%M:%S') if transferencia.data_modificacao else '-' }}" readonly disabled>
        </div>
        
        <div style="margin-top: 1.5rem;">
            <button type="submit" class="btn btn-success">Salvar Alterações</button>
            <a href="{{ url_for('transferencia.listar') }}" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
