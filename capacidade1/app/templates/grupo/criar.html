{% extends "base.html" %}

{% block title %}Novo Grupo - Capacidade 1{% endblock %}

{% block content %}
<div class="page-header">
    <h2>C126T: Novo Grupo</h2>
</div>

<div class="form-container">
    <h3>Criar Novo Grupo</h3>
    <form method="POST" class="form">
        <div class="form-group">
            <label for="codigo_grupo">Código Grupo <span style="color:red;">*</span></label>
            <input type="number" id="codigo_grupo" name="codigo_grupo" min="0" max="99" required placeholder="2 dígitos">
        </div>
        
        <div class="form-group">
            <label for="tipo_orgao">Tipo Órgão <span style="color:red;">*</span></label>
            <input type="text" id="tipo_orgao" name="tipo_orgao" required placeholder="Filtrado por sessão" disabled>
            <small style="display:block; margin-top:0.25rem; color:#666;">Campo preenchido automaticamente pela sessão</small>
        </div>
        
        <div class="form-group">
            <label for="descricao">Descrição <span style="color:red;">*</span></label>
            <input type="text" id="descricao" name="descricao" maxlength="40" required placeholder="Máximo 40 caracteres">
        </div>
        
        <div class="form-group">
            <label for="codigo_unidade">Unidade Orçamentária <span style="color:red;">*</span></label>
            <select id="codigo_unidade" name="codigo_unidade" required>
                <option value="">Selecione uma unidade</option>
                {% for unidade in unidades %}
                <option value="{{ unidade.codigo_unidade }}">{{ unidade.codigo_unidade }} - {{ unidade.descricao }}</option>
                {% endfor %}
            </select>
        </div>
        
        <div style="margin-top: 1.5rem;">
            <button type="submit" class="btn btn-success">Salvar</button>
            <a href="{{ url_for('grupo.listar') }}" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
