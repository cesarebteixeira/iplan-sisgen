{% extends "base.html" %}

{% block title %}Detalhes da Fonte - Capacidade 1{% endblock %}

{% block content %}
<div class="page-header">
    <h2>C144T: Detalhes da Fonte de Recursos</h2>
    <div>
        <a href="{{ url_for('fonte.listar') }}" class="btn btn-secondary">Voltar à Listagem</a>
    </div>
</div>

<div class="form-container">
    <h3>Informações da Fonte</h3>
    
    <div class="form">
        <div class="form-group">
            <label>Código Fonte</label>
            <input type="text" value="{{ fonte.codigo_fonte }}" readonly disabled>
        </div>
        
        <div class="form-group">
            <label>Código Órgão</label>
            <input type="text" value="{{ fonte.codigo_orgao }}" readonly disabled>
        </div>
        
        <div class="form-group">
            <label>Descrição</label>
            <input type="text" value="{{ fonte.descricao }}" readonly disabled>
        </div>
        
        <div class="form-group">
            <label>FNDE</label>
            <input type="text" value="{{ fonte.ind_fnde if fonte.ind_fnde else '-' }}" readonly disabled>
        </div>
        
        <div class="form-group">
            <label>Data de Criação</label>
            <input type="text" value="{{ fonte.data_criacao.strftime('%Y-%m-%d %H:%M:%S') if fonte.data_criacao else '-' }}" readonly disabled>
        </div>
        
        <div class="form-group">
            <label>Data de Modificação</label>
            <input type="text" value="{{ fonte.data_modificacao.strftime('%Y-%m-%d %H:%M:%S') if fonte.data_modificacao else '-' }}" readonly disabled>
        </div>
    </div>
</div>
{% endblock %}
