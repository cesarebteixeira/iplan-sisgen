{% extends "base.html" %}

{% block title %}Novo Tipo de Processo - Capacidade 1{% endblock %}

{% block content %}
<div class="page-header">
    <h2>C162T: Novo Tipo de Processo</h2>
</div>

<div class="form-container">
    <h3>Criar Novo Tipo de Processo</h3>
    <form method="POST" class="form">
        <div class="form-group">
            <label for="codigo_tipo">Código <span style="color:red;">*</span></label>
            <input type="number" id="codigo_tipo" name="codigo_tipo" min="0" max="99" required placeholder="2 dígitos">
        </div>
        
        <div class="form-group">
            <label for="tipo_orgao">Tipo Órgão <span style="color:red;">*</span></label>
            <input type="text" id="tipo_orgao" name="tipo_orgao" required placeholder="Filtrado por sessão" disabled>
            <small style="display:block; margin-top:0.25rem; color:#666;">Campo preenchido automaticamente pela sessão</small>
        </div>
        
        <div class="form-group">
            <label for="descricao">Descrição <span style="color:red;">*</span></label>
            <input type="text" id="descricao" name="descricao" maxlength="40" required placeholder="Máximo 40 caracteres">
        </div>
        
        <div style="margin-top: 1.5rem;">
            <button type="submit" class="btn btn-success">Salvar</button>
            <a href="{{ url_for('tipo_processo.listar') }}" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
