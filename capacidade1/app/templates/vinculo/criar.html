{% extends "base.html" %}

{% block title %}Novo Vínculo - Capacidade 1{% endblock %}

{% block content %}
<div class="page-header">
    <h2>C207T: Novo Vínculo Órgão-Projeto</h2>
</div>

<div class="form-container">
    <h3>Criar Novo Vínculo</h3>
    <form method="POST" class="form">
        <div class="form-group">
            <label for="codigo_orgao">Código Órgão <span style="color:red;">*</span></label>
            <input type="text" id="codigo_orgao" name="codigo_orgao" required placeholder="Identificador do órgão">
        </div>
        
        <div class="form-group">
            <label for="codigo_projeto">Projeto <span style="color:red;">*</span></label>
            <select id="codigo_projeto" name="codigo_projeto" required>
                <option value="">Selecione um projeto</option>
                {% for projeto in projetos %}
                <option value="{{ projeto.codigo_projeto }}">{{ "%02d" | format(projeto.codigo_projeto) }} - {{ projeto.descricao }}</option>
                {% endfor %}
            </select>
        </div>
        
        <div class="form-group">
            <label for="secretaria">Secretaria <span style="color:red;">*</span></label>
            <input type="text" id="secretaria" name="secretaria" required placeholder="Scoped pela sessão" disabled>
            <small style="display:block; margin-top:0.25rem; color:#666;">Campo preenchido automaticamente pela sessão</small>
        </div>
        
        <div class="form-group">
            <label for="coordenadoria">Coordenadoria</label>
            <input type="text" id="coordenadoria" name="coordenadoria" placeholder="Referência de coordenadoria (opcional)">
        </div>
        
        <div style="margin-top: 1.5rem;">
            <button type="submit" class="btn btn-success">Salvar</button>
            <a href="{{ url_for('vinculo.listar') }}" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
