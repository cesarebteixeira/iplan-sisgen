{% extends "base.html" %}

{% block title %}Editar Conta Classificada - Capacidade 1{% endblock %}

{% block content %}
<div class="page-header">
    <h2>C147T: Editar Conta Classificada</h2>
</div>

<div class="form-container">
    <div class="alert alert-danger" style="margin-bottom: 1.5rem;">
        <strong>Atenção:</strong> A alteração de fonte é BLOQUEADA por regra de negócio.
    </div>
    
    <h3>Editar Conta Classificada</h3>
    <form method="POST" class="form">
        <div class="form-group">
            <label>Conta</label>
            <input type="text" value="{{ conta.conta }}" readonly disabled>
        </div>
        
        <div class="form-group">
            <label>Código Órgão</label>
            <input type="text" value="{{ conta.codigo_orgao }}" readonly disabled>
        </div>
        
        <div class="form-group">
            <label>Fonte de Recursos</label>
            <input type="text" value="{{ conta.codigo_fonte }}" readonly disabled>
            <small style="display:block; margin-top:0.25rem; color:#666;">Campo bloqueado para alteração</small>
        </div>
        
        <div class="form-group">
            <label for="creche">Creche <span style="color:red;">*</span></label>
            <select id="creche" name="creche" required>
                <option value="S" {% if conta.creche == 'S' %}selected{% endif %}>Sim</option>
                <option value="N" {% if conta.creche == 'N' %}selected{% endif %}>Não</option>
            </select>
        </div>
        
        <div class="form-group">
            <label>Data de Criação</label>
            <input type="text" value="{{ conta.data_criacao.strftime('%Y-%m-%d %H:%M:%S') if conta.data_criacao else '-' }}" readonly disabled>
        </div>
        
        <div class="form-group">
            <label>Data de Modificação</label>
            <input type="text" value="{{ conta.data_modificacao.strftime('%Y-%m-%d %H:%M:%S') if conta.data_modificacao else '-' }}" readonly disabled>
        </div>
        
        <div style="margin-top: 1.5rem;">
            <button type="submit" class="btn btn-success">Salvar Alterações</button>
            <a href="{{ url_for('conta.listar') }}" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
